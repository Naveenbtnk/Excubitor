name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cloudops_ai
          POSTGRES_USER: cloudops
          POSTGRES_PASSWORD: cloudops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudops -d cloudops_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # The tests that prove the rate limit and provider budget hold across workers need a
      # real server; without it they skip rather than pass.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # The integration suite creates and migrates cloudops_ai_test on this server.
      TEST_DATABASE_URL: postgresql+asyncpg://cloudops:cloudops@localhost:5432/cloudops_ai_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Tests
        working-directory: frontend
        run: npm test

      # Blocks on high/critical only. Two moderate findings remain in
      # @tailwindcss/typography -> postcss-selector-parser, whose only "fix" is a forced
      # downgrade of the plugin to 0.5.4 - the same kind of downgrade the project already
      # rejected when it moved to Tailwind v4.
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: frontend
        # Next.js evaluates rewrites() at build time, so BACKEND_URL has to be set here.
        env:
          BACKEND_URL: http://backend:8000
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            BACKEND_URL=http://backend:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
