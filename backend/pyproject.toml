[project]
name = "cloudops-ai-backend"
version = "1.0.0"
description = "Excubitor — CloudOps AI backend: FastAPI, PostgreSQL + pgvector, Gemini"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.54,<1",
    "gunicorn>=26,<27",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.31,<1",
    "alembic>=1.20,<2",
    "pgvector>=0.5,<1",
    "google-genai>=2.25,<3",
    "httpx>=0.28,<1",
    "pyjwt>=2.15,<3",
    "pwdlib[argon2]>=0.3,<1",
    "sse-starlette>=3.4,<4",
    "python-multipart>=0.0.20",
    "redis>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
