services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cloudops_ai
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - cloudops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops_ai"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://cloudops:cloudops@db:5432/cloudops_ai
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      COOKIE_SECURE: "false"
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cloudops-postgres:
